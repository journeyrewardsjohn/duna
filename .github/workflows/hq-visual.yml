name: HQ visual regression

# Compares HQ against the committed screenshots in
# tests/e2e/hq-visual/__screenshots__. It is separate from the release gate
# and is not a required check. See "HQ visual regression" in
# docs/OPERATIONS.md.
#
# Baselines are rendered here, in the Playwright container on an x86-64
# runner, and nowhere else. To regenerate them, add the
# `hq-visual:update-baselines` label to the pull request (or dispatch this
# workflow with `update` checked), then download the `hq-visual-baselines`
# artifact and commit it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/hq/**"
      - "packages/ui/**"
      - "packages/core/src/demo.ts"
      - "tests/e2e/hq-visual/**"
      - "playwright.config.ts"
      - "playwright.hq-visual.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/hq-visual.yml"
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate the baselines and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: hq-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The container must ship the same browser build that the lockfile
      # installs, or every screenshot shifts when one of them moves.
      - name: Read the locked Playwright version
        id: resolve
        run: |
          version="$(sed -n "s|^  '@playwright/test@\([0-9.]*\)':$|\1|p" pnpm-lock.yaml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  screenshots:
    name: ${{ (github.event.action == 'labeled' || inputs.update) && 'Render baselines' || 'Compare screenshots' }}
    needs: playwright-version
    # A label event only does work when it is the baseline label.
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'hq-visual:update-baselines'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    env:
      CI: "true"
      HOME: /root
      UPDATE_BASELINES: ${{ (github.event.action == 'labeled' || inputs.update) && 'true' || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare screenshots
        if: env.UPDATE_BASELINES != 'true'
        run: pnpm test:visual:hq

      - name: Render baselines
        if: env.UPDATE_BASELINES == 'true'
        run: |
          rm -rf tests/e2e/hq-visual/__screenshots__
          pnpm test:visual:hq --update-snapshots

      - name: Upload rendered baselines
        if: env.UPDATE_BASELINES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hq-visual-baselines
          path: tests/e2e/hq-visual/__screenshots__/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hq-visual-report
          path: |
            test-results/hq-visual/
            playwright-report/hq-visual/
          if-no-files-found: ignore
          retention-days: 7
