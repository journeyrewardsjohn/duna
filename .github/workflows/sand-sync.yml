name: Sync Sand data

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "15 */2 * * *"
    - cron: "*/30 * * * *"
    - cron: "15 */6 * * *"
    - cron: "10 10 * * *"
    - cron: "45 10 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Feed to refresh
        required: true
        default: live
        type: choice
        options:
          - live
          - vw-live
          - avp
          - index
          - rankings
          - research
          - players

concurrency:
  group: sand-sync-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select feed
        id: feed
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_MODE" ]; then
            mode="$MANUAL_MODE"
          elif [ "$SCHEDULE" = "*/5 * * * *" ]; then
            mode="vw-live"
          elif [ "$SCHEDULE" = "15 */2 * * *" ]; then
            mode="live"
          elif [ "$SCHEDULE" = "*/30 * * * *" ]; then
            mode="avp"
          elif [ "$SCHEDULE" = "15 */6 * * *" ]; then
            mode="index"
          elif [ "$SCHEDULE" = "45 10 * * *" ]; then
            mode="research"
          elif [ "$SCHEDULE" = "20 11 * * *" ]; then
            mode="players"
          else
            mode="rankings"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Refresh ${{ steps.feed.outputs.mode }}
        env:
          CRON_SECRET: ${{ secrets.DUNA_CRON_SECRET }}
          MODE: ${{ steps.feed.outputs.mode }}
        run: |
          response_file="$RUNNER_TEMP/sand-refresh.json"
          if ! http_status="$(curl --fail-with-body --show-error --silent \
              --retry 3 \
              --retry-all-errors \
              --max-time 540 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CRON_SECRET" \
              "https://hq.duna.coach/api/cron/sand?mode=$MODE")"; then
            cat "$response_file"
            exit 1
          fi
          cat "$response_file"
          case "$http_status" in
            2??) ;;
            *)
              echo "::error::Sand refresh returned HTTP $http_status"
              exit 1
              ;;
          esac
