name: Sync Sand data

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "15 */6 * * *"
    - cron: "10 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Feed to refresh
        required: true
        default: live
        type: choice
        options:
          - live
          - index
          - rankings

concurrency:
  group: sand-sync-${{ github.event.schedule || inputs.mode }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select feed
        id: feed
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_MODE" ]; then
            mode="$MANUAL_MODE"
          elif [ "$SCHEDULE" = "*/15 * * * *" ]; then
            mode="live"
          elif [ "$SCHEDULE" = "15 */6 * * *" ]; then
            mode="index"
          else
            mode="rankings"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Refresh ${{ steps.feed.outputs.mode }}
        env:
          CRON_SECRET: ${{ secrets.DUNA_CRON_SECRET }}
          MODE: ${{ steps.feed.outputs.mode }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --max-time 540 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://duna-hq-suttonx.vercel.app/api/cron/sand?mode=$MODE"
