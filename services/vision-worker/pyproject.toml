[project]
name = "duna-vision-worker"
version = "0.1.0"
description = "GPU execution and held-out validation for Duna Vision"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "cryptography>=45,<46",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "onnxruntime-gpu>=1.22,<2; platform_system == 'Linux'",
  "onnxruntime>=1.22,<2; platform_system != 'Linux'",
  "opencv-python-headless>=4.11,<5",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
duna-vision-worker = "duna_vision_worker.app:main"
duna-vision-validate = "duna_vision_worker.validation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duna_vision_worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
